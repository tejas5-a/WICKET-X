name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          echo "Detected Java Major Version: ${JAVA_VER}"
          if [ -z "$JAVA_VER" ] || [ "$JAVA_VER" -lt 17 ]; then
            echo "::error::Java version must be >= 17, but detected: '$JAVA_VER'"
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_VER)."

      - name: Set up Android SDK environment
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "Android SDK Directory: ${SDK_DIR}"
          mkdir -p "${SDK_DIR}/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${SDK_DIR}/licenses/android-sdk-license" || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "${SDK_DIR}/licenses/android-sdk-license" || true
          echo "8933bad161af6e7874ade48829947d1a63d86a43" >> "${SDK_DIR}/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "${SDK_DIR}/licenses/android-sdk-preview-license" || true
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
          elif [ -x "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate Gradle Wrapper
        run: |
          set -euo pipefail
          echo "=== Validating Gradle Wrapper ==="
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::gradle/wrapper/gradle-wrapper.jar is missing!"
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Ensure environment configuration files
        run: |
          set -euo pipefail
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Copying .env.example to .env..."
            cp .env.example .env
          fi

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ] && [ -s "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists at $KEYSTORE_PATH."
          elif [ -f "./debug.keystore.base64" ] && [ -s "./debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d "./debug.keystore.base64" > "$KEYSTORE_PATH"
          else
            echo "Generating temporary debug keystore at $KEYSTORE_PATH..."
            KEYTOOL="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL" ]; then
              KEYTOOL="keytool"
            fi
            "$KEYTOOL" -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to create or verify debug keystore at $KEYSTORE_PATH."
            exit 1
          fi
          echo "Verified debug keystore at $KEYSTORE_PATH."

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify generated Debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "::warning::Expected APK not found at $EXPECTED_APK. Searching in app/build/outputs/apk..."
            FOUND_APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -s "$FOUND_APK" ]; then
              echo "Found APK paths in app/build/outputs/apk:"
              find app/build/outputs/apk -name "*.apk" -type f
              echo "Relocating discovered debug APK $FOUND_APK to $EXPECTED_APK..."
              mkdir -p "$(dirname "$EXPECTED_APK")"
              cp "$FOUND_APK" "$EXPECTED_APK"
            else
              echo "::error::No valid APK file found in app/build/outputs/apk"
              exit 1
            fi
          fi
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file at $EXPECTED_APK is missing or empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::File $EXPECTED_APK does not have .apk extension."
              exit 1
              ;;
          esac
          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          APK_SIZE=$(wc -c < "$EXPECTED_APK")
          echo "Successfully verified debug APK at $EXPECTED_APK (${APK_SIZE} bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WicketX-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SANITIZED_REPO_NAME" ]; then
            SANITIZED_REPO_NAME="wicketx"
          fi
          ASSET_FILENAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$ASSET_DIR"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"
          cp -f "$SOURCE_APK" "$ASSET_PATH"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_TAG="${TAG_NAME}"
            RELEASE_TITLE="WicketX Release ${TAG_NAME}"
          else
            RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_PATH}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Verifying gh CLI version..."
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          RELEASE_TAG="${{ steps.prepare_asset.outputs.release_tag }}"
          RELEASE_TITLE="${{ steps.prepare_asset.outputs.release_title }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset does not exist or is empty at $ASSET_PATH."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Asset $ASSET_PATH does not have .apk extension."
              exit 1
              ;;
          esac
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat << EOF > "$NOTES_FILE"
          ### WicketX Automated Debug APK Build

          - **Build System:** Built automatically by GitHub Actions
          - **Run Number:** #${GITHUB_RUN_NUMBER}
          - **Run Attempt:** #${GITHUB_RUN_ATTEMPT}
          - **Source Commit:** \`${GITHUB_SHA}\`
          - **Testing Notice:** This is an automatically generated debug APK intended for testing purposes only.
          - **Production Notice:** This APK is not a Google Play Store production release.
          - **Keystore Notice:** Signed only with a temporary debug keystore.
          - **Direct Mobile Install:** Download the attached \`.apk\` file directly to your Android device for installation.
          EOF
          echo "Publishing GitHub Release ${RELEASE_TAG}..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "=== Build & Release Summary ==="
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="${{ steps.prepare_asset.outputs.release_tag }}"
            RELEASE_TITLE="${{ steps.prepare_asset.outputs.release_title }}"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            echo "GitHub Release published successfully!"
            echo "Tag: $RELEASE_TAG"
            echo "Title: $RELEASE_TITLE"
            echo "Asset: $ASSET_NAME"
            echo "Release URL: $RELEASE_URL"
            {
              echo "## 🚀 WicketX Debug APK Build Succeeded"
              echo ""
              echo "Your debug APK is built and ready for direct mobile download!"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **APK Asset:** \`${ASSET_NAME}\`"
              echo "- **Release Page:** [View Release and Download APK](${RELEASE_URL})"
              echo "- **Workflow Artifact:** Also available under Actions artifacts as \`WicketX-Debug-APK\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing encountered an error or was skipped."
            echo "The debug APK artifact 'WicketX-Debug-APK' was successfully built and uploaded."
            echo "You can download 'WicketX-Debug-APK' directly from the GitHub Actions run Summary page."
            {
              echo "## ⚠️ WicketX Debug APK Build Completed (Release Note)"
              echo ""
              echo "The Android debug APK was **built successfully**."
              echo ""
              echo "- **Artifact Name:** \`WicketX-Debug-APK\`"
              echo "- **Location:** Check the **Artifacts** section at the bottom of this GitHub Actions run."
              echo "- **Release Status:** Automatic GitHub Release publishing could not be completed. You can download the APK from the Actions artifacts above."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
