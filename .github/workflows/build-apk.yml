name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK environment variables
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "Android SDK Directory: ${SDK_DIR}"

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          echo "Accepting existing Android SDK licenses..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK Platform 36 and Build-Tools
        run: |
          set -euo pipefail
          echo "Installing cmdline-tools, platform 36, and build-tools 36.0.0..."
          sdkmanager --install "cmdline-tools;latest" "platforms;android-36" "build-tools;36.0.0"
          echo "Re-accepting any newly added licenses..."
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Verify Android SDK installation
        run: |
          set -euo pipefail
          echo "=== Android Environment Diagnostics ==="
          echo "ANDROID_HOME: ${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT}"
          echo "Installed Platforms:"
          ls -la "${ANDROID_HOME}/platforms"
          echo "Installed Build Tools:"
          ls -la "${ANDROID_HOME}/build-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper and environment files
        run: |
          set -euo pipefail
          if [ ! -f "./gradlew" ]; then
            echo "Generating Gradle wrapper script (9.3.1)..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Ensure debug keystore exists
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ] && [ -s "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists at $KEYSTORE_PATH."
          elif [ -f "./debug.keystore.base64" ] && [ -s "./debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d "./debug.keystore.base64" > "$KEYSTORE_PATH"
          else
            echo "Generating temporary debug keystore at $KEYSTORE_PATH..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to create or verify debug keystore at $KEYSTORE_PATH."
            exit 1
          fi

      - name: Verify Gradle environment (gradlew --version)
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: ./gradlew --version

      - name: Verify project configuration (gradlew tasks)
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: ./gradlew tasks --no-daemon

      - name: Build Debug APK with Gradle Wrapper (gradlew assembleDebug)
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify generated Debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Expected non-empty APK was not found at $EXPECTED_APK"
            find app/build/outputs -type f || true
            exit 1
          fi
          APK_SIZE=$(wc -c < "$EXPECTED_APK")
          echo "Verified debug APK at $EXPECTED_APK (${APK_SIZE} bytes)."

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WicketX-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SANITIZED_REPO_NAME" ]; then
            SANITIZED_REPO_NAME="wicketx"
          fi
          ASSET_FILENAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$ASSET_DIR"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"
          cp -f "$SOURCE_APK" "$ASSET_PATH"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          {
            echo "asset_path=${ASSET_PATH}"
            echo "asset_name=${ASSET_FILENAME}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          RELEASE_TAG="${{ steps.prepare_asset.outputs.release_tag }}"
          RELEASE_TITLE="${{ steps.prepare_asset.outputs.release_title }}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          {
            echo "### WicketX Automated Debug APK Build"
            echo ""
            echo "- **Built by:** GitHub Actions"
            echo "- **Run Number:** ${GITHUB_RUN_NUMBER}"
            echo "- **Source Commit SHA:** ${GITHUB_SHA}"
          } > "$NOTES_FILE"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest
